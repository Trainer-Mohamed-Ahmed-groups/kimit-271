<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend session</title>
</head>

<body>

    <a href="#">Home</a>
    <a href="./about.html">About</a>
    <!-- Col span & row span -->

    <table border>
        <caption>This is for bla</caption>
        <thead>
            <tr>
                <th>Name</th>
                <th colspan="2">Personal details</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Mahmoud</td>
                <td rowspan="2">20</td>
                <td rowspan="3">Devloper</td>
            </tr>
            <tr>
                <td>Ali</td>
            </tr>
            <tr>
                <td>Mahmoud</td>
                <td>28</td>
            </tr>
        </tbody>
    </table>

    <!-- Course => (Frontend || Backend) -->

    <form action="">
        <input type="text" placeholder="Enter your name" name="username" autocomplete="off" autofocus required>
        <select name="course">
            <optgroup label="Frontend">
                <option value="html">HTML</option>
                <option value="css">CSS</option>
            </optgroup>
            <optgroup label="Backend">
                <option value="node" selected>Node</option>
                <option value="mongo db">MongoDB</option>
            </optgroup>
        </select><br><br>
        <textarea name="" rows="10" cols="30" maxlength="10" readonly>this is text</textarea> <br><br>
        <input type="url" name=""><br><br>
        <input type="range" max="10" step="2" value="2" name=""><br><br>
        <input type="search" name=""><br><br>
        <input type="email" name=""><br><br>
        <input type="file" disabled multiple accept=".pdf" name=""><br><br>
        <input type="hidden" name="formLang" value="en"><br><br>


        <hr>

        <input type="radio" checked name="gender" id="male" value="Male">
        <label for="male">Male</label><br>
        <input type="radio" name="gender" id="female" value="Female">
        <label for="female">Female</label>
        <br><br>

        <input type="checkbox" name="track" id="frontend" value="frontend">
        <label for="frontend">Frontend</label><br>
        <input type="checkbox" name="track" id="backend" value="backend">
        <label for="backend">Backend</label><br>
        <input type="checkbox" name="track" id="ux" value="ux">
        <label for="ux">UX</label>

        <!-- <input type="checkbox" name=""> -->

        <hr>
        <input type="image" src="./images/html_image.png" width="100px" alt="This is an image">
        <input type="reset" value="Reset">
        <input type="submit" value="Ok">
    </form>

</body>

</html>
